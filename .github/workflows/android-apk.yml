name: Build KopiLaba Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Create branded Android icon source
        run: |
          python -m pip install pillow
          mkdir -p assets
          python - <<'PY'
          from PIL import Image, ImageDraw
          S=1024
          im=Image.new('RGB',(S,S),(18,140,74))
          px=im.load()
          for y in range(S):
            for x in range(S):
              t=(x+y)/(2*S)
              px[x,y]=(int(30-12*t),int(190-65*t),int(100-38*t))
          d=ImageDraw.Draw(im)
          d.rounded_rectangle((180,150,275,810),radius=20,fill=(255,255,255))
          d.polygon([(260,440),(555,150),(790,150),(470,470),(810,810),(565,810),(330,590),(275,650)],fill=(255,255,255))
          d.polygon([(280,810),(385,650),(500,570),(455,660),(330,810)],fill=(185,248,201))
          im.save('assets/icon.png')
          PY
      - name: Build web app
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Enable immersive full-screen Android app
        run: |
          python - <<'PY'
          from pathlib import Path
          candidates = list(Path('android/app/src/main/java').rglob('MainActivity.java'))
          if not candidates:
            raise SystemExit('MainActivity.java not found in generated Android project')
          p = candidates[0]
          s = p.read_text()
          if 'SYSTEM_UI_FLAG_IMMERSIVE_STICKY' not in s:
            s = s.replace('import com.getcapacitor.BridgeActivity;', '''import com.getcapacitor.BridgeActivity;
          import android.os.Bundle;
          import android.view.View;''')
            s = s.replace('public class MainActivity extends BridgeActivity {', '''public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                  );
              }''')
          p.write_text(s)
          print('Configured immersive full-screen:', p)
          PY
      - name: Configure Android OAuth deep link
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          marker='</activity>'
          intent='''<intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="id.kopilaba.app" android:host="auth" android:pathPrefix="/callback"/></intent-filter>'''
          if intent not in s:
            s=s.replace(marker, intent + marker, 1)
          p.write_text(s)
          PY
      - name: Generate native app icons
        run: npx capacitor-assets generate --android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KopiLaba-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
