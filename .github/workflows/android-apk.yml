name: Build KopiLaba Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Create branded Android icon source
        run: |
          python -m pip install pillow
          mkdir -p assets
          python - <<'PY'
          from PIL import Image, ImageDraw
          S=1024
          im=Image.new('RGB',(S,S),(18,140,74))
          px=im.load()
          for y in range(S):
            for x in range(S):
              t=(x+y)/(2*S)
              px[x,y]=(int(30-12*t),int(190-65*t),int(100-38*t))
          d=ImageDraw.Draw(im)
          d.ellipse((100,100,924,924),fill=(255,255,255,30))
          d.rounded_rectangle((260,390,710,745),radius=75,fill=(255,255,255))
          d.arc((650,445,825,655),start=265,end=95,fill=(255,255,255),width=48)
          d.line((330,510,640,510),fill=(18,140,74),width=28)
          d.line((385,585,585,585),fill=(18,140,74),width=22)
          for x in (385,510,635):
            d.arc((x-35,235,x+35,375),start=190,end=330,fill=(255,255,255),width=22)
          im.save('assets/icon.png')
          PY
      - name: Build web app
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Generate native app icons
        run: npx capacitor-assets generate --android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KopiLaba-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
